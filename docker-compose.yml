services:
  postgres:
    image: postgres:16-alpine
    container_name: ml_fast_publisher_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlpublisher
      POSTGRES_PASSWORD: mlpublisher
      POSTGRES_DB: mlpublisher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
